
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Hu Jiahui</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  
  <body>
    <body class="gallery-page">
    <button id="theme-toggle" aria-label="切换主题">
      <span class="icon">🌙</span>
    </button>

    <header class="nav-header animate-in" style="--delay: 0.1s">
      <nav class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/gallery.html" class="nav-link active">Gallery</a>
      </nav>
    </header>
    
    <div class="layout-wrapper">
      
      <main class="gallery-container animate-in" style="--delay: 0.2s">
        
        <div class="photo-card" style="background: var(--card-bg); width: 300px; padding: 40px; display: flex; flex-direction: column; justify-content: center;">
          <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 10px;">Through<br>My Lens</h1>
          <p style="color: var(--text-secondary); margin-bottom: 20px;">
            A collection of moments.<br>Swipe right to explore →
          </p>
          <div style="font-size: 12px; color: var(--accent);">
            <i class="fa fa-camera"></i> Sony A7C2
          </div>
        </div>

        <div class="photo-card">
          <img src="/static/images/gallery/Mt.Yulong.jpg" alt="Description" loading="lazy">
          <div class="photo-info">
            <h3>Mt.Jade Dragon, Yunnan </h3>
            <p style="font-size: 12px; opacity: 0.8;">June 2024 · 35mm</p>
          </div>
        </div>

        <div class="photo-card">
          <img src="/static/images/gallery/Sunset.jpg" alt="Description" loading="lazy">
          <div class="photo-info">
            <h3>Sunset in Qingdao</h3>
            <p style="font-size: 12px; opacity: 0.8;">June 2024 · 35mm</p>
          </div>
        </div>

        <div class="photo-card">
          <img src="/static/images/gallery/Nanjing.jpg" alt="Description" loading="lazy">
          <div class="photo-info">
            <h3>Sun Yat-sen Mausoleum, Nanjing</h3>
            <p style="font-size: 12px; opacity: 0.8;">June 2024 · 35mm</p>
          </div>
        </div>


        


      </main>

    </div>

    <script src="/static/js/dark-mode.js"></script>
    <script>
      // 启用鼠标滚轮横向滚动（为没有触摸板的 PC 用户优化体验）
      const container = document.querySelector('.gallery-container');
      container.addEventListener('wheel', (evt) => {
        if (evt.deltaY !== 0) { // 如果是垂直滚动
          evt.preventDefault();
          container.scrollLeft += evt.deltaY;
        }
      });
    </script>
  </body>
</html>
