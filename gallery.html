<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Hu Jiahui</title>
    <meta name="description" content="Photography gallery by Hu Jiahui">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('preferred-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css?v=20261015-gallery">
  </head>

  <body class="gallery-page">
    <button id="theme-toggle" class="spring-btn" aria-label="Toggle colour theme">
      <span class="icon">🌙</span>
    </button>

    <header class="nav-header animate-in" style="--delay: 0.1s">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/" class="nav-link">Home</a>
        <a href="/gallery.html" class="nav-link active">Gallery</a>
      </nav>
    </header>

    <main class="gallery-shell animate-in" style="--delay: 0.2s">
      <section class="gallery-hero" aria-labelledby="gallery-title">
        <div class="gallery-hero-content">
          <p class="gallery-kicker">Photography</p>
          <h1 id="gallery-title">Through My Lens</h1>
          <p class="gallery-lede">Mountains, sea, gardens, art, campus light, cats, and quiet city fragments.</p>
          <div class="gallery-meta">
            <span id="gallery-count">26 photos</span>
            <span>Sony A7C2</span>
          </div>
        </div>
      </section>

      <section class="gallery-toolbar" aria-label="Gallery filters">
        <button class="filter-chip active" type="button" data-filter="all">
          <i class="fa fa-th-large" aria-hidden="true"></i>
          <span>All</span>
        </button>
        <button class="filter-chip" type="button" data-filter="mountains">
          <i class="fa fa-picture-o" aria-hidden="true"></i>
          <span>Mountains</span>
        </button>
        <button class="filter-chip" type="button" data-filter="sea">
          <i class="fa fa-tint" aria-hidden="true"></i>
          <span>Sea</span>
        </button>
        <button class="filter-chip" type="button" data-filter="campus">
          <i class="fa fa-leaf" aria-hidden="true"></i>
          <span>Campus</span>
        </button>
        <button class="filter-chip" type="button" data-filter="gardens">
          <i class="fa fa-tree" aria-hidden="true"></i>
          <span>Gardens</span>
        </button>
        <button class="filter-chip" type="button" data-filter="art">
          <i class="fa fa-paint-brush" aria-hidden="true"></i>
          <span>Art</span>
        </button>
        <button class="filter-chip" type="button" data-filter="cities">
          <i class="fa fa-building-o" aria-hidden="true"></i>
          <span>Cities</span>
        </button>
        <button class="filter-chip" type="button" data-filter="cats">
          <i class="fa fa-paw" aria-hidden="true"></i>
          <span>Cats</span>
        </button>
      </section>

      <section id="gallery-grid" class="gallery-grid" aria-live="polite"></section>
    </main>

    <div id="gallery-lightbox" class="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
      <button class="lightbox-action lightbox-close" type="button" aria-label="Close photo">
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
      <button class="lightbox-action lightbox-prev" type="button" aria-label="Previous photo">
        <i class="fa fa-angle-left" aria-hidden="true"></i>
      </button>
      <figure class="lightbox-frame">
        <img id="lightbox-img" alt="">
        <figcaption>
          <strong id="lightbox-title"></strong>
          <span id="lightbox-caption"></span>
        </figcaption>
      </figure>
      <button class="lightbox-action lightbox-next" type="button" aria-label="Next photo">
        <i class="fa fa-angle-right" aria-hidden="true"></i>
      </button>
    </div>

    <script src="/static/js/dark-mode.js?v=20260912"></script>
    <script src="/static/js/gallery.js?v=20260912"></script>
  </body>
</html>
